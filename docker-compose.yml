services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MAX_CONTENT_LENGTH: 524288000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
